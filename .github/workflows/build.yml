name: Build and push image

on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".dockerignore", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Contract test
        run: |
          docker build -t mastra-factory-railway:test .
          test/contract.sh mastra-factory-railway:test
      # GHCR repository names must be lowercase; the owner login may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mastra-factory-railway" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Railway runs amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:0.25.0-r2
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
